name: CI

# Every push and pull request: the install Netlify does (pnpm, frozen lockfile,
# so package.json and pnpm-lock.yaml must agree), the typecheck, the tests and
# the build Bolt and Netlify publish. Deploys stay where they are (Bolt's
# Publish button, Netlify's own build); this only gates what reaches main.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install with the lockfile Netlify uses
        run: npx --yes pnpm@10.17.1 install --frozen-lockfile

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
